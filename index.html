<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#ffffff">
<title>小账本 App 版</title>
<style>
  :root{
    --bg:#f5f6f8;
    --card:#ffffff;
    --text:#111827;
    --muted:#6b7280;
    --line:#e5e7eb;
    --accent:#111827;
    --accent-soft:#f3f4f6;
    --ok:#16a34a;
    --warn:#ea580c;
    --danger:#dc2626;
    --shadow:0 8px 24px rgba(0,0,0,.06);
    --radius:18px;
    --safe-top: env(safe-area-inset-top);
    --safe-bottom: env(safe-area-inset-bottom);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Hiragino Sans GB","Microsoft YaHei","Segoe UI",sans-serif}
  body{padding-top:var(--safe-top)}
  .app{max-width:560px;margin:0 auto;min-height:100dvh;position:relative;background:var(--bg)}
  .screen{display:none;padding:14px 14px 100px}
  .screen.active{display:block}
  .header{display:flex;justify-content:space-between;align-items:flex-start;padding:8px 4px 10px}
  .title{font-size:28px;font-weight:800;letter-spacing:-.6px}
  .subtitle{font-size:13px;color:var(--muted);margin-top:4px}
  .month-badge{border:1px solid var(--line);background:#fff;border-radius:14px;padding:8px 10px;box-shadow:var(--shadow)}
  .month-badge input{border:0;outline:0;background:transparent;font:inherit;color:inherit;width:110px}
  .banner{background:#111827;color:#fff;border-radius:20px;padding:16px;box-shadow:var(--shadow);margin:4px 0 12px}
  .banner .big{font-size:34px;font-weight:850;line-height:1}
  .banner .small{opacity:.85;font-size:13px}
  .banner .row{display:flex;justify-content:space-between;align-items:end;gap:10px;margin-top:8px}
  .progress{height:8px;background:rgba(255,255,255,.22);border-radius:999px;overflow:hidden;margin-top:12px}
  .progress>div{height:100%;background:#fff;width:0%}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px;box-shadow:var(--shadow)}
  .card-title{font-size:13px;color:var(--muted)}
  .card-value{font-size:24px;font-weight:800;margin-top:6px;letter-spacing:-.4px}
  .card-note{font-size:12px;color:var(--muted);margin-top:6px}
  .section-title{font-size:18px;font-weight:800;padding:8px 4px 10px}
  .budget-list{display:grid;gap:10px}
  .budget-item{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px;box-shadow:var(--shadow)}
  .budget-top{display:flex;justify-content:space-between;align-items:center;gap:10px}
  .budget-name{font-weight:800}
  .budget-remain{font-size:22px;font-weight:850}
  .budget-meta{font-size:12px;color:var(--muted);margin-top:6px}
  .budget-progress{height:8px;background:#eef0f3;border-radius:999px;overflow:hidden;margin-top:10px}
  .budget-progress>div{height:100%;background:var(--accent);width:0%}
  .hint{font-size:12px;color:var(--muted);padding:0 4px}
  .category-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .cat-btn{border:1px solid var(--line);background:#fff;border-radius:18px;padding:18px 12px;box-shadow:var(--shadow);text-align:left}
  .cat-btn.active{outline:2px solid var(--accent);background:var(--accent-soft)}
  .cat-btn .t{font-size:17px;font-weight:800}
  .cat-btn .s{font-size:12px;color:var(--muted);margin-top:6px}
  .form-card{display:grid;gap:12px}
  label{display:block;font-size:13px;color:var(--muted);margin-bottom:6px}
  input,button,select,textarea{font:inherit}
  input,select,textarea{
    width:100%;border:1px solid var(--line);background:#fff;border-radius:16px;padding:14px 14px;outline:none
  }
  input:focus,textarea:focus{border-color:#cbd5e1}
  .money-row{display:grid;grid-template-columns:1fr;gap:10px}
  .quick-amounts{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
  .pill{
    border:1px solid var(--line);background:#fff;border-radius:999px;padding:11px 8px;text-align:center;box-shadow:var(--shadow)
  }
  .primary{
    background:var(--accent);color:#fff;border:0;border-radius:18px;padding:16px 16px;font-weight:800;box-shadow:var(--shadow)
  }
  .secondary{
    background:#fff;color:var(--text);border:1px solid var(--line);border-radius:16px;padding:14px 14px;box-shadow:var(--shadow)
  }
  .ghost{
    background:#fff;color:var(--danger);border:1px solid #fecaca;border-radius:12px;padding:7px 10px;font-size:12px
  }
  .entry-list{display:grid;gap:10px}
  .entry{
    background:#fff;border:1px solid var(--line);border-radius:16px;padding:12px 14px;box-shadow:var(--shadow);
    display:grid;grid-template-columns:60px 1fr auto;gap:10px;align-items:center
  }
  .entry-date{font-size:12px;color:var(--muted)}
  .entry-day{font-size:18px;font-weight:850}
  .entry-main{min-width:0}
  .entry-cat{font-weight:800}
  .entry-note{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:4px}
  .entry-amt{text-align:right}
  .entry-money{font-size:18px;font-weight:850}
  .empty{color:var(--muted);text-align:center;padding:24px 10px}
  .settings-list{display:grid;gap:10px}
  .row2{display:grid;grid-template-columns:1fr 110px;gap:10px;align-items:center}
  .small{font-size:12px;color:var(--muted)}
  .footer-space{height:10px}
  .tabbar{
    position:fixed;left:50%;transform:translateX(-50%);bottom:0;max-width:560px;width:100%;
    padding:10px 12px calc(10px + var(--safe-bottom));background:rgba(245,246,248,.94);backdrop-filter:blur(12px);
    border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);gap:8px
  }
  .tab{
    border:0;background:transparent;border-radius:16px;padding:10px 8px;color:var(--muted)
  }
  .tab.active{background:#fff;color:var(--text);box-shadow:var(--shadow)}
  .tab .ico{font-size:18px;line-height:1}
  .tab .txt{font-size:11px;margin-top:4px}
  .fab{
    position:fixed;right:22px;bottom:88px;width:58px;height:58px;border-radius:50%;border:0;background:var(--accent);color:#fff;
    font-size:32px;line-height:58px;box-shadow:0 12px 28px rgba(0,0,0,.18)
  }
  .install-tip{
    display:flex;justify-content:space-between;align-items:center;gap:8px;
    background:#fff;border:1px dashed var(--line);border-radius:16px;padding:12px 14px;margin-top:6px
  }
  .toast{
    position:fixed;left:50%;transform:translateX(-50%);bottom:92px;background:#111827;color:#fff;
    border-radius:999px;padding:12px 16px;font-size:13px;opacity:0;pointer-events:none;transition:.22s ease
  }
  .toast.show{opacity:1}
  .tag{display:inline-block;background:#f3f4f6;color:#374151;padding:4px 8px;border-radius:999px;font-size:12px}
</style>
</head>
<body>
<div class="app">

  <section id="home" class="screen active">
    <div class="header">
      <div>
        <div class="title">小账本</div>
        <div class="subtitle">只记 5 类，重点看还剩多少</div>
      </div>
      <div class="month-badge"><input id="monthPicker" type="month"></div>
    </div>

    <div class="banner">
      <div class="small">本月剩余</div>
      <div class="row">
        <div class="big" id="totalRemain">¥0</div>
        <div style="text-align:right">
          <div class="small">已花 / 预算</div>
          <div id="totalSpent">¥0 / ¥1500</div>
        </div>
      </div>
      <div class="progress"><div id="totalBar"></div></div>
    </div>

    <div class="grid2">
      <div class="card">
        <div class="card-title">今日已花</div>
        <div class="card-value" id="todaySpent">¥0</div>
        <div class="card-note">按今天的记录自动统计</div>
      </div>
      <div class="card">
        <div class="card-title">本周建议可花</div>
        <div class="card-value" id="weekAdvice">¥0</div>
        <div class="card-note">用剩余预算平均到本周</div>
      </div>
    </div>

    <div class="section-title">分类余额</div>
    <div class="budget-list" id="budgetList"></div>

    <div class="section-title">小提示</div>
    <div class="install-tip">
      <div>
        <div style="font-weight:800">更像 App 的用法</div>
        <div class="small">用手机浏览器打开后，可尝试“添加到主屏幕”</div>
      </div>
      <span class="tag">更顺手</span>
    </div>
    <div class="footer-space"></div>
  </section>

  <section id="add" class="screen">
    <div class="header">
      <div>
        <div class="title">记一笔</div>
        <div class="subtitle">分类先点一下，再输入金额</div>
      </div>
    </div>

    <div class="section-title">1. 选择分类</div>
    <div class="category-grid" id="catGrid"></div>

    <div class="section-title">2. 输入金额</div>
    <div class="card form-card">
      <div class="money-row">
        <div>
          <label>金额（元）</label>
          <input id="amountInput" type="number" inputmode="decimal" min="0" step="0.01" placeholder="例如 25">
        </div>
      </div>
      <div>
        <label>快捷金额</label>
        <div class="quick-amounts">
          <button class="pill" data-money="10">¥10</button>
          <button class="pill" data-money="25">¥25</button>
          <button class="pill" data-money="30">¥30</button>
          <button class="pill" data-money="50">¥50</button>
        </div>
      </div>
      <div>
        <label>备注（可不填）</label>
        <input id="noteInput" maxlength="40" placeholder="例如：午饭 / 和同学聚餐">
      </div>
      <button class="primary" id="saveEntryBtn">确认记账</button>
      <button class="secondary" id="canteenBtn">一键记“食堂 25 元”</button>
    </div>
  </section>

  <section id="records" class="screen">
    <div class="header">
      <div>
        <div class="title">记录</div>
        <div class="subtitle">按当前月份查看与删除</div>
      </div>
    </div>
    <div class="entry-list" id="entryList"></div>
  </section>

  <section id="settings" class="screen">
    <div class="header">
      <div>
        <div class="title">设置</div>
        <div class="subtitle">预算、备份、恢复</div>
      </div>
    </div>
    <div class="card">
      <div style="font-weight:800;margin-bottom:12px">预算设置</div>
      <div class="settings-list" id="budgetEditor"></div>
      <button class="primary" id="saveBudgetBtn" style="margin-top:12px">保存预算</button>
    </div>

    <div class="card" style="margin-top:12px">
      <div style="font-weight:800;margin-bottom:12px">数据管理</div>
      <div class="small" style="margin-bottom:10px">数据保存在当前浏览器里，建议偶尔导出备份。</div>
      <div style="display:grid;gap:10px">
        <button class="secondary" id="exportBtn">导出备份</button>
        <button class="secondary" id="importBtn">导入备份</button>
        <input id="importFile" type="file" accept="application/json" style="display:none">
        <button class="secondary" id="resetMonthBtn">清空当前月记录</button>
      </div>
    </div>
  </section>

  <button class="fab" id="fabBtn">＋</button>

  <div class="tabbar">
    <button class="tab active" data-target="home"><div class="ico">🏠</div><div class="txt">首页</div></button>
    <button class="tab" data-target="add"><div class="ico">➕</div><div class="txt">记一笔</div></button>
    <button class="tab" data-target="records"><div class="ico">📄</div><div class="txt">记录</div></button>
    <button class="tab" data-target="settings"><div class="ico">⚙️</div><div class="txt">设置</div></button>
  </div>

  <div id="toast" class="toast"></div>
</div>

<script>
const DEFAULT_BUDGETS = {
  "食堂": 750,
  "聚餐": 150,
  "衣服": 150,
  "日用品": 150,
  "机动/储蓄": 300
};
const KEY = "simple_budget_mobile_app_v1";
let data = loadData();
let selectedCategory = "食堂";

function nowMonth(){
  const d = new Date();
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0");
}
function nowDateStr(){
  const d = new Date();
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
}
function loadData(){
  try{
    const x = JSON.parse(localStorage.getItem(KEY));
    if(x && x.budgets && x.entries) return x;
  }catch(e){}
  return { budgets:{...DEFAULT_BUDGETS}, entries:[] };
}
function saveData(){ localStorage.setItem(KEY, JSON.stringify(data)); }
function money(n){ return "¥"+Math.round(Number(n || 0)); }
function showToast(msg){
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(showToast.timer);
  showToast.timer = setTimeout(()=>t.classList.remove("show"), 1600);
}
function currentMonth(){ return document.getElementById("monthPicker").value || nowMonth(); }
function monthEntries(){
  const ym = currentMonth();
  return data.entries.filter(e => e.date.slice(0,7) === ym);
}
function spentByCat(cat){
  return monthEntries().filter(e => e.category === cat).reduce((s,e)=>s+Number(e.amount),0);
}
function totalBudget(){ return Object.values(data.budgets).reduce((s,n)=>s+Number(n),0); }
function totalSpent(){ return monthEntries().reduce((s,e)=>s+Number(e.amount),0); }
function todaySpent(){
  const today = nowDateStr();
  return data.entries.filter(e => e.date === today).reduce((s,e)=>s+Number(e.amount),0);
}
function getRemainingWeekAdvice(){
  const ym = currentMonth();
  const [year,month] = ym.split("-").map(Number);
  const today = new Date();
  const isCurrent = (today.getFullYear()===year && today.getMonth()+1===month);
  const remain = Math.max(0, totalBudget() - totalSpent());
  if(!isCurrent) return Math.round(remain/4);

  const end = new Date(year, month, 0);
  const day = today.getDate();
  const daysLeft = Math.max(1, end.getDate() - day + 1);
  const weeksLeft = Math.max(1, Math.ceil(daysLeft / 7));
  return Math.round(remain / weeksLeft);
}
function formatDay(dateStr){
  const d = dateStr.slice(8);
  return d;
}
function renderHome(){
  const spent = totalSpent();
  const budget = totalBudget();
  const remain = budget - spent;
  document.getElementById("totalRemain").textContent = money(remain);
  document.getElementById("totalSpent").textContent = money(spent) + " / " + money(budget);
  document.getElementById("totalBar").style.width = Math.min(100, (spent / (budget || 1)) * 100) + "%";
  document.getElementById("todaySpent").textContent = money(todaySpent());
  document.getElementById("weekAdvice").textContent = money(getRemainingWeekAdvice());

  const list = document.getElementById("budgetList");
  list.innerHTML = "";
  Object.entries(data.budgets).forEach(([cat,b])=>{
    const spent = spentByCat(cat);
    const remain = Number(b) - spent;
    const pct = Math.min(100, Math.max(0, (spent / (Number(b)||1)) * 100));
    const el = document.createElement("div");
    el.className = "budget-item";
    el.innerHTML = `
      <div class="budget-top">
        <div class="budget-name">${escapeHtml(cat)}</div>
        <div class="budget-remain">${money(remain)}</div>
      </div>
      <div class="budget-meta">已花 ${money(spent)} / 预算 ${money(b)}</div>
      <div class="budget-progress"><div style="width:${pct}%"></div></div>
    `;
    list.appendChild(el);
  });
}
function renderAddScreen(){
  const grid = document.getElementById("catGrid");
  grid.innerHTML = "";
  Object.entries(data.budgets).forEach(([cat, b])=>{
    const remain = Number(b) - spentByCat(cat);
    const btn = document.createElement("button");
    btn.className = "cat-btn" + (selectedCategory===cat ? " active":"");
    btn.innerHTML = `<div class="t">${escapeHtml(cat)}</div><div class="s">剩余 ${money(remain)}</div>`;
    btn.onclick = () => { selectedCategory = cat; renderAddScreen(); };
    grid.appendChild(btn);
  });
}
function renderRecords(){
  const list = document.getElementById("entryList");
  const arr = monthEntries().sort((a,b)=>b.ts-a.ts);
  if(!arr.length){
    list.innerHTML = `<div class="card empty">这个月还没有记录</div>`;
    return;
  }
  list.innerHTML = "";
  arr.forEach(e=>{
    const item = document.createElement("div");
    item.className = "entry";
    item.innerHTML = `
      <div>
        <div class="entry-date">${e.date.slice(5,7)}月</div>
        <div class="entry-day">${formatDay(e.date)}</div>
      </div>
      <div class="entry-main">
        <div class="entry-cat">${escapeHtml(e.category)}</div>
        <div class="entry-note">${escapeHtml(e.note || "")}</div>
      </div>
      <div class="entry-amt">
        <div class="entry-money">-${money(e.amount)}</div>
        <button class="ghost">删除</button>
      </div>
    `;
    item.querySelector("button").onclick = ()=> {
      if(confirm("确定删除这条记录吗？")){
        data.entries = data.entries.filter(x => x.id !== e.id);
        saveData();
        renderAll();
        showToast("已删除");
      }
    };
    list.appendChild(item);
  });
}
function renderSettings(){
  const wrap = document.getElementById("budgetEditor");
  wrap.innerHTML = "";
  Object.entries(data.budgets).forEach(([cat, v])=>{
    const row = document.createElement("div");
    row.className = "row2";
    row.innerHTML = `
      <div>${escapeHtml(cat)}</div>
      <input type="number" min="0" step="1" value="${Math.round(Number(v))}" data-cat="${escapeAttr(cat)}">
    `;
    wrap.appendChild(row);
  });
}
function renderAll(){
  renderHome();
  renderAddScreen();
  renderRecords();
  renderSettings();
}
function addEntry(category, amount, note){
  const n = Number(amount);
  if(!category){ showToast("先选分类"); return; }
  if(!n || n <= 0){ showToast("请输入正确金额"); return; }
  let date = nowDateStr();
  const month = currentMonth();
  if(date.slice(0,7) !== month) date = month + "-01";
  data.entries.push({
    id: Date.now().toString(36) + Math.random().toString(36).slice(2,7),
    category, amount:n, note:note || "", date, ts:Date.now()
  });
  saveData();
  document.getElementById("amountInput").value = "";
  document.getElementById("noteInput").value = "";
  renderAll();
  showToast("记账成功");
  goTab("home");
}
function saveBudget(){
  document.querySelectorAll("#budgetEditor input").forEach(input=>{
    data.budgets[input.dataset.cat] = Number(input.value) || 0;
  });
  saveData();
  renderAll();
  showToast("预算已保存");
}
function exportData(){
  const blob = new Blob([JSON.stringify(data, null, 2)], {type:"application/json"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "小账本备份.json";
  a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href), 1500);
}
function importData(file){
  const reader = new FileReader();
  reader.onload = ()=>{
    try{
      const x = JSON.parse(reader.result);
      if(!x.budgets || !x.entries) throw new Error("bad");
      data = x;
      saveData();
      renderAll();
      showToast("导入成功");
    }catch(e){
      showToast("备份文件格式不对");
    }
  };
  reader.readAsText(file);
}
function resetCurrentMonth(){
  const ym = currentMonth();
  if(!confirm("确定清空当前月份的所有记录吗？")) return;
  data.entries = data.entries.filter(e => e.date.slice(0,7) !== ym);
  saveData();
  renderAll();
  showToast("当前月记录已清空");
}
function goTab(id){
  document.querySelectorAll(".screen").forEach(s => s.classList.remove("active"));
  document.getElementById(id).classList.add("active");
  document.querySelectorAll(".tab").forEach(t => t.classList.toggle("active", t.dataset.target === id));
}
function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
}
function escapeAttr(s){ return escapeHtml(s); }

document.getElementById("monthPicker").value = nowMonth();
document.getElementById("monthPicker").addEventListener("change", renderAll);

document.querySelectorAll(".tab").forEach(tab=>{
  tab.onclick = ()=> goTab(tab.dataset.target);
});
document.getElementById("fabBtn").onclick = ()=> goTab("add");

document.getElementById("saveEntryBtn").onclick = ()=>{
  addEntry(
    selectedCategory,
    document.getElementById("amountInput").value,
    document.getElementById("noteInput").value.trim()
  );
};
document.getElementById("canteenBtn").onclick = ()=> addEntry("食堂", 25, "");
document.querySelectorAll(".pill").forEach(btn=>{
  btn.onclick = ()=>{
    document.getElementById("amountInput").value = btn.dataset.money;
  };
});
document.getElementById("amountInput").addEventListener("keydown", e=>{
  if(e.key === "Enter") document.getElementById("saveEntryBtn").click();
});
document.getElementById("saveBudgetBtn").onclick = saveBudget;
document.getElementById("exportBtn").onclick = exportData;
document.getElementById("importBtn").onclick = ()=> document.getElementById("importFile").click();
document.getElementById("importFile").onchange = (e)=>{
  const f = e.target.files[0];
  if(f) importData(f);
  e.target.value = "";
};
document.getElementById("resetMonthBtn").onclick = resetCurrentMonth;

renderAll();
</script>
</body>
</html>
