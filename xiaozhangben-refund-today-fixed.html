<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#ffffff">
<title>小账本 2.0</title>
<style>
:root{
  --bg:#f5f6f8;--card:#fff;--text:#111827;--muted:#6b7280;--line:#e5e7eb;
  --accent:#111827;--soft:#f3f4f6;--ok:#16a34a;--warn:#d97706;--danger:#dc2626;
  --shadow:0 8px 24px rgba(0,0,0,.06);--radius:18px;
  --safe-top:env(safe-area-inset-top);--safe-bottom:env(safe-area-inset-bottom)
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Microsoft YaHei","Segoe UI",sans-serif}
body{padding-top:var(--safe-top)}
.app{max-width:560px;margin:0 auto;min-height:100dvh}
.screen{display:none;padding:14px 14px 102px}.screen.active{display:block}
.header{display:flex;justify-content:space-between;align-items:flex-start;padding:8px 4px 10px}
.title{font-size:28px;font-weight:850;letter-spacing:-.6px}.subtitle{font-size:13px;color:var(--muted);margin-top:4px}
.month-badge{border:1px solid var(--line);background:#fff;border-radius:14px;padding:8px 10px;box-shadow:var(--shadow)}
.month-badge input{border:0;outline:0;background:transparent;font:inherit;color:inherit;width:112px}
.banner{background:#111827;color:#fff;border-radius:22px;padding:16px;box-shadow:var(--shadow);margin:4px 0 12px}
.banner .big{font-size:34px;font-weight:900;line-height:1}.banner .small{opacity:.82;font-size:13px}
.banner .row{display:flex;justify-content:space-between;align-items:end;gap:10px;margin-top:8px}
.progress{height:8px;background:rgba(255,255,255,.22);border-radius:999px;overflow:hidden;margin-top:12px}
.progress>div{height:100%;background:#fff;width:0%}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px;box-shadow:var(--shadow)}
.card-title{font-size:13px;color:var(--muted)}.card-value{font-size:24px;font-weight:850;margin-top:6px}.card-note{font-size:12px;color:var(--muted);margin-top:6px}
.section-title{font-size:18px;font-weight:850;padding:14px 4px 10px}
.budget-list{display:grid;gap:10px}
.budget-item{background:#fff;border:1px solid var(--line);border-radius:16px;padding:12px 14px;box-shadow:var(--shadow)}
.budget-top{display:flex;justify-content:space-between;align-items:center}.budget-name{font-weight:850}.budget-remain{font-size:22px;font-weight:900}
.budget-meta{font-size:12px;color:var(--muted);margin-top:6px}.budget-progress{height:8px;background:#eef0f3;border-radius:999px;overflow:hidden;margin-top:10px}
.budget-progress>div{height:100%;background:var(--accent)}
.status{display:inline-block;font-size:11px;padding:3px 7px;border-radius:999px;margin-left:6px}
.status.ok{background:#ecfdf5;color:#166534}.status.warn{background:#fff7ed;color:#9a3412}.status.danger{background:#fef2f2;color:#991b1b}
.category-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cat-btn{border:1px solid var(--line);background:#fff;border-radius:18px;padding:18px 12px;box-shadow:var(--shadow);text-align:left}
.cat-btn.active{outline:2px solid var(--accent);background:var(--soft)}.cat-btn .t{font-size:17px;font-weight:850}.cat-btn .s{font-size:12px;color:var(--muted);margin-top:6px}
.form-card{display:grid;gap:12px}label{display:block;font-size:13px;color:var(--muted);margin-bottom:6px}
input,button{font:inherit}input{width:100%;border:1px solid var(--line);background:#fff;border-radius:16px;padding:14px;outline:none}
.quick-amounts{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.pill{border:1px solid var(--line);background:#fff;border-radius:999px;padding:11px 8px;box-shadow:var(--shadow)}
.primary{background:var(--accent);color:#fff;border:0;border-radius:18px;padding:16px;font-weight:850;box-shadow:var(--shadow)}
.secondary{background:#fff;color:var(--text);border:1px solid var(--line);border-radius:16px;padding:14px;box-shadow:var(--shadow)}
.ghost{background:#fff;color:var(--danger);border:1px solid #fecaca;border-radius:12px;padding:7px 10px;font-size:12px}
.refund-btn{background:#fff;color:var(--ok);border:1px solid #bbf7d0;border-radius:12px;padding:7px 10px;font-size:12px}.entry-actions{display:flex;justify-content:flex-end;gap:6px;margin-top:6px;flex-wrap:wrap}.entry-money.refund{color:var(--ok)}.refund-meta{color:var(--ok)}
.entry-list{display:grid;gap:10px}.entry{background:#fff;border:1px solid var(--line);border-radius:16px;padding:12px 14px;box-shadow:var(--shadow);display:grid;grid-template-columns:60px 1fr auto;gap:10px;align-items:center}
.entry-date{font-size:12px;color:var(--muted)}.entry-day{font-size:18px;font-weight:900}.entry-main{min-width:0}.entry-cat{font-weight:850}.entry-note{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:4px}.entry-money{font-size:18px;font-weight:900}
.empty{color:var(--muted);text-align:center;padding:24px 10px}.settings-list{display:grid;gap:10px}.row2{display:grid;grid-template-columns:1fr 110px;gap:10px;align-items:center}.small{font-size:12px;color:var(--muted)}
.switchrow{display:flex;justify-content:space-between;align-items:center;gap:12px}.switch{position:relative;width:48px;height:28px;background:#d1d5db;border-radius:999px;flex:0 0 auto}.switch.on{background:#111827}.switch:after{content:"";position:absolute;width:22px;height:22px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.2s}.switch.on:after{left:23px}
.tabbar{position:fixed;left:50%;transform:translateX(-50%);bottom:0;max-width:560px;width:100%;padding:10px 12px calc(10px + var(--safe-bottom));background:rgba(245,246,248,.94);backdrop-filter:blur(12px);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.tab{border:0;background:transparent;border-radius:16px;padding:9px 6px;color:var(--muted)}.tab.active{background:#fff;color:var(--text);box-shadow:var(--shadow)}.tab .ico{font-size:17px}.tab .txt{font-size:10px;margin-top:3px}
.fab{position:fixed;right:22px;bottom:92px;width:58px;height:58px;border-radius:50%;border:0;background:var(--accent);color:#fff;font-size:32px;box-shadow:0 12px 28px rgba(0,0,0,.18)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:96px;background:#111827;color:#fff;border-radius:999px;padding:12px 16px;font-size:13px;opacity:0;pointer-events:none;transition:.2s}.toast.show{opacity:1}
.chart-wrap{display:grid;grid-template-columns:170px 1fr;gap:12px;align-items:center}.legend{display:grid;gap:8px}.legend-row{display:flex;justify-content:space-between;gap:8px;font-size:12px}.legend-left{display:flex;align-items:center;gap:7px}.dot{width:10px;height:10px;border-radius:50%}
.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}.dow{text-align:center;font-size:11px;color:var(--muted);padding:4px 0}.day{min-height:58px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:6px;position:relative}.day.off{opacity:.35}.daynum{font-size:12px;font-weight:700}.daysum{position:absolute;left:6px;right:6px;bottom:6px;font-size:11px;font-weight:800;text-align:right}.day.spent1{background:#f8fafc}.day.spent2{background:#fef3c7}.day.spent3{background:#fee2e2}
.alert-card{border-left:5px solid var(--warn)}.alert-card.danger{border-left-color:var(--danger)}
.carry{font-size:12px;color:var(--muted);margin-top:6px}
@media(max-width:420px){.chart-wrap{grid-template-columns:1fr}.chart-wrap canvas{margin:0 auto}.grid2{grid-template-columns:1fr 1fr}.tab .txt{font-size:9px}}
</style>
</head>
<body>
<div class="app">
<section id="home" class="screen active">
  <div class="header">
    <div><div class="title">小账本 2.0</div><div class="subtitle">1500 元预算，简单记、看得清</div></div>
    <div class="month-badge"><input id="monthPicker" type="month"></div>
  </div>
  <div class="banner">
    <div class="small">本月剩余</div>
    <div class="row">
      <div><div class="big" id="totalRemain">¥0</div><div class="carry" id="carryInfo"></div></div>
      <div style="text-align:right"><div class="small">净支出 / 可用预算</div><div id="totalSpent">¥0 / ¥1500</div></div>
    </div>
    <div class="progress"><div id="totalBar"></div></div>
  </div>

  <div id="alertBox"></div>

  <div class="grid2">
    <div class="card"><div class="card-title">今日净支出</div><div class="card-value" id="todaySpent">¥0</div><div class="card-note" id="todaySpentNote">仅统计今天，不结转昨日</div></div>
    <div class="card"><div class="card-title">本周建议可花</div><div class="card-value" id="weekAdvice">¥0</div><div class="card-note">按本月剩余预算估算</div></div>
  </div>

  <div class="section-title">分类余额</div>
  <div class="budget-list" id="budgetList"></div>
</section>

<section id="add" class="screen">
  <div class="header"><div><div class="title">记一笔</div><div class="subtitle">选择分类，再输入金额</div></div></div>
  <div class="section-title">1. 分类</div>
  <div class="category-grid" id="catGrid"></div>
  <div class="section-title">2. 金额</div>
  <div class="card form-card">
    <div><label>金额（元）</label><input id="amountInput" type="number" inputmode="decimal" min="0" step="0.01" placeholder="例如 25.50"></div>
    <div><label>快捷金额</label><div class="quick-amounts">
      <button class="pill" data-money="10">¥10</button><button class="pill" data-money="25">¥25</button><button class="pill" data-money="30">¥30</button><button class="pill" data-money="50">¥50</button>
    </div></div>
    <div><label>备注（可不填）</label><input id="noteInput" maxlength="40" placeholder="例如：午饭 / 和同学聚餐"></div>
    <button class="primary" id="saveEntryBtn">确认记账</button>
    <button class="secondary" id="canteenBtn">一键记“食堂 25 元”</button>
  </div>
</section>

<section id="stats" class="screen">
  <div class="header"><div><div class="title">统计</div><div class="subtitle">这个月的钱花到哪里了</div></div></div>
  <div class="card">
    <div style="font-weight:850;margin-bottom:12px">分类净支出</div>
    <div class="chart-wrap">
      <canvas id="donut" width="170" height="170"></canvas>
      <div class="legend" id="legend"></div>
    </div>
  </div>
  <div class="section-title">消费日历</div>
  <div class="card">
    <div class="calendar" id="calendar"></div>
    <div class="small" style="margin-top:10px">颜色越深代表当天支出越高。</div>
  </div>
</section>

<section id="records" class="screen">
  <div class="header"><div><div class="title">记录</div><div class="subtitle">查看、退款与删除当月记录</div></div></div>
  <div class="entry-list" id="entryList"></div>
</section>

<section id="settings" class="screen">
  <div class="header"><div><div class="title">设置</div><div class="subtitle">预算、结转与备份</div></div></div>

  <div class="card">
    <div style="font-weight:850;margin-bottom:12px">预算设置</div>
    <div class="settings-list" id="budgetEditor"></div>
    <button class="primary" id="saveBudgetBtn" style="margin-top:12px">保存预算</button>
  </div>

  <div class="card" style="margin-top:12px">
    <div class="switchrow">
      <div>
        <div style="font-weight:850">自动结转</div>
        <div class="small">上个月没花完的钱，自动加到本月“机动/储蓄”</div>
      </div>
      <button id="carrySwitch" class="switch" aria-label="自动结转"></button>
    </div>
  </div>

  <div class="card" style="margin-top:12px">
    <div style="font-weight:850;margin-bottom:12px">数据管理</div>
    <div class="small" style="margin-bottom:10px">数据保存在当前浏览器。建议偶尔导出备份。</div>
    <div style="display:grid;gap:10px">
      <button class="secondary" id="exportBtn">导出备份</button>
      <button class="secondary" id="importBtn">导入备份</button>
      <input id="importFile" type="file" accept="application/json" style="display:none">
      <button class="secondary" id="resetMonthBtn">清空当前月记录</button>
    </div>
  </div>
</section>

<button class="fab" id="fabBtn">＋</button>
<div class="tabbar">
  <button class="tab active" data-target="home"><div class="ico">🏠</div><div class="txt">首页</div></button>
  <button class="tab" data-target="add"><div class="ico">➕</div><div class="txt">记一笔</div></button>
  <button class="tab" data-target="stats"><div class="ico">📊</div><div class="txt">统计</div></button>
  <button class="tab" data-target="records"><div class="ico">📄</div><div class="txt">记录</div></button>
  <button class="tab" data-target="settings"><div class="ico">⚙️</div><div class="txt">设置</div></button>
</div>
<div id="toast" class="toast"></div>
</div>

<script>
const DEFAULT_BUDGETS={"食堂":750,"聚餐":150,"衣服":150,"日用品":150,"机动/储蓄":300};
const KEY="simple_budget_mobile_app_v1"; // 沿用旧版 key，尽量保留原数据
const COLORS=["#111827","#6b7280","#9ca3af","#d1d5db","#4b5563"];
let data=loadData();
if(typeof data.carryoverEnabled!=="boolean") data.carryoverEnabled=false;
let selectedCategory="食堂";
let entrySubmitLocked=false;
let lastKnownDate=nowDateStr();

function loadData(){
  try{
    const x=JSON.parse(localStorage.getItem(KEY));
    if(x&&x.budgets&&x.entries) return x;
  }catch(e){}
  return {budgets:{...DEFAULT_BUDGETS},entries:[],carryoverEnabled:false};
}
function saveData(){localStorage.setItem(KEY,JSON.stringify(data))}
function nowMonth(){const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")}
function nowDateStr(){const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function prevMonth(ym){let [y,m]=ym.split("-").map(Number);m--;if(m===0){m=12;y--}return y+"-"+String(m).padStart(2,"0")}
function currentMonth(){return document.getElementById("monthPicker").value||nowMonth()}
function baseBudget(){return Object.values(data.budgets).reduce((s,n)=>s+Number(n),0)}
function entriesFor(ym){return data.entries.filter(e=>e.date.slice(0,7)===ym)}
function entryType(e){return e.type==="refund"?"refund":"expense"}
function signedAmount(e){return entryType(e)==="refund"?-Number(e.amount):Number(e.amount)}
function netSpentOnDate(date){
  return normalizeMoney(data.entries.filter(e=>e.date===date).reduce((s,e)=>s+signedAmount(e),0));
}
function setEntryButtonsDisabled(disabled){
  ["saveEntryBtn","canteenBtn"].forEach(id=>{const btn=document.getElementById(id);if(btn)btn.disabled=disabled});
}
function spentFor(ym){return entriesFor(ym).reduce((s,e)=>s+signedAmount(e),0)}
function spentByCat(cat,ym=currentMonth()){return entriesFor(ym).filter(e=>e.category===cat).reduce((s,e)=>s+signedAmount(e),0)}
function refundedFor(originalId){return data.entries.filter(e=>entryType(e)==="refund"&&e.originalId===originalId).reduce((s,e)=>s+Number(e.amount),0)}
function refundableAmount(entry){return normalizeMoney(Math.max(0,Number(entry.amount)-refundedFor(entry.id)))}
function normalizeMoney(n){
  const v=Number(n);
  return Number.isFinite(v)?Math.round((v+Number.EPSILON)*100)/100:0;
}
function money(n){return "¥"+normalizeMoney(n).toFixed(2)}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function escapeAttr(s){return escapeHtml(s)}
function showToast(msg){const t=document.getElementById("toast");t.textContent=msg;t.classList.add("show");clearTimeout(showToast.timer);showToast.timer=setTimeout(()=>t.classList.remove("show"),1600)}

function earliestRecordedMonth(){
  if(!data.entries.length) return nowMonth();
  return data.entries.map(e=>e.date.slice(0,7)).sort()[0];
}
function carryInto(ym){
  if(!data.carryoverEnabled) return 0;
  let p=prevMonth(ym), guard=0, carry=0;
  const earliest=earliestRecordedMonth();
  // 从最早记录月往后递推到上个月
  let months=[];
  let cur=earliest;
  while(cur<=p && guard<60){months.push(cur); let [y,m]=cur.split("-").map(Number);m++;if(m===13){m=1;y++}cur=y+"-"+String(m).padStart(2,"0");guard++}
  if(!months.length) return 0;
  for(const m of months){
    const effective=baseBudget()+carry;
    const remain=Math.max(0,effective-spentFor(m));
    carry=remain;
  }
  return carry;
}
function categoryBudget(cat,ym=currentMonth()){
  let b=Number(data.budgets[cat]||0);
  if(cat==="机动/储蓄") b+=carryInto(ym);
  return b;
}
function effectiveTotalBudget(ym=currentMonth()){return baseBudget()+carryInto(ym)}

function renderHome(){
  const ym=currentMonth(), spent=spentFor(ym), budget=effectiveTotalBudget(ym), remain=budget-spent, carry=carryInto(ym);
  document.getElementById("totalRemain").textContent=money(remain);
  document.getElementById("totalSpent").textContent=money(spent)+" / "+money(budget);
  document.getElementById("totalBar").style.width=Math.min(100,Math.max(0,(spent/(budget||1))*100))+"%";
  document.getElementById("carryInfo").textContent=carry>0?("含结转 "+money(carry)):"";
  const todayStr=nowDateStr();
  document.getElementById("todaySpent").textContent=money(netSpentOnDate(todayStr));
  const todayNote=document.getElementById("todaySpentNote");
  if(todayNote)todayNote.textContent=`仅统计 ${Number(todayStr.slice(5,7))}月${Number(todayStr.slice(8,10))}日，不结转昨日`;
  const [y,m]=ym.split("-").map(Number), today=new Date(), isCurrent=(today.getFullYear()===y&&today.getMonth()+1===m);
  const daysLeft=isCurrent?Math.max(1,new Date(y,m,0).getDate()-today.getDate()+1):28;
  document.getElementById("weekAdvice").textContent=money(Math.max(0,remain)/Math.max(1,Math.ceil(daysLeft/7)));

  const list=document.getElementById("budgetList");list.innerHTML="";
  Object.keys(data.budgets).forEach(cat=>{
    const b=categoryBudget(cat,ym), s=spentByCat(cat,ym), r=b-s, pct=(s/(b||1))*100;
    let cls="ok", label="正常";
    if(pct>=100){cls="danger";label="已超预算"}else if(pct>=80){cls="warn";label="接近上限"}
    const el=document.createElement("div");el.className="budget-item";
    el.innerHTML=`<div class="budget-top"><div><span class="budget-name">${escapeHtml(cat)}</span><span class="status ${cls}">${label}</span></div><div class="budget-remain">${money(r)}</div></div>
      <div class="budget-meta">已花 ${money(s)} / 预算 ${money(b)}</div>
      <div class="budget-progress"><div style="width:${Math.min(100,Math.max(0,pct))}%"></div></div>`;
    list.appendChild(el);
  });

  const alertBox=document.getElementById("alertBox");alertBox.innerHTML="";
  const alerts=[];
  Object.keys(data.budgets).forEach(cat=>{
    const b=categoryBudget(cat,ym),s=spentByCat(cat,ym),pct=s/(b||1);
    if(pct>=1) alerts.push(`${cat} 已超预算 ${money(s-b)}`);
    else if(pct>=.8) alerts.push(`${cat} 已用了 ${Math.round(pct*100)}%`);
  });
  if(alerts.length){
    const c=document.createElement("div");
    c.className="card alert-card"+(alerts.some(x=>x.includes("超预算"))?" danger":"");
    c.innerHTML=`<div style="font-weight:850">预算提醒</div><div class="small" style="margin-top:6px">${alerts.map(escapeHtml).join("；")}</div>`;
    alertBox.appendChild(c);
  }
}

function renderAdd(){
  const grid=document.getElementById("catGrid");grid.innerHTML="";
  Object.keys(data.budgets).forEach(cat=>{
    const r=categoryBudget(cat)-spentByCat(cat);
    const b=document.createElement("button");b.className="cat-btn"+(selectedCategory===cat?" active":"");
    b.innerHTML=`<div class="t">${escapeHtml(cat)}</div><div class="s">剩余 ${money(r)}</div>`;
    b.onclick=()=>{selectedCategory=cat;renderAdd()};grid.appendChild(b);
  });
}

function drawDonut(){
  const canvas=document.getElementById("donut"),ctx=canvas.getContext("2d"),cats=Object.keys(data.budgets);
  const vals=cats.map(c=>spentByCat(c)),netTotal=vals.reduce((a,b)=>a+b,0),chartVals=vals.map(v=>Math.max(0,v)),chartTotal=chartVals.reduce((a,b)=>a+b,0);
  ctx.clearRect(0,0,170,170);
  if(chartTotal<=0){
    ctx.beginPath();ctx.arc(85,85,60,0,Math.PI*2);ctx.strokeStyle="#e5e7eb";ctx.lineWidth=24;ctx.stroke();
  }else{
    let start=-Math.PI/2;
    chartVals.forEach((v,i)=>{if(!v)return;const a=v/chartTotal*Math.PI*2;ctx.beginPath();ctx.arc(85,85,60,start,start+a);ctx.strokeStyle=COLORS[i%COLORS.length];ctx.lineWidth=24;ctx.stroke();start+=a});
  }
  ctx.fillStyle="#111827";ctx.font="800 18px -apple-system,BlinkMacSystemFont,sans-serif";ctx.textAlign="center";ctx.fillText(money(netTotal),85,81);
  ctx.fillStyle="#6b7280";ctx.font="12px -apple-system,BlinkMacSystemFont,sans-serif";ctx.fillText("本月净支出",85,100);
  const legend=document.getElementById("legend");legend.innerHTML="";
  cats.forEach((c,i)=>{const v=vals[i];const row=document.createElement("div");row.className="legend-row";row.innerHTML=`<div class="legend-left"><span class="dot" style="background:${COLORS[i%COLORS.length]}"></span><span>${escapeHtml(c)}</span></div><strong>${money(v)}</strong>`;legend.appendChild(row)});
}

function renderCalendar(){
  const wrap=document.getElementById("calendar");wrap.innerHTML="";
  ["一","二","三","四","五","六","日"].forEach(d=>{const el=document.createElement("div");el.className="dow";el.textContent=d;wrap.appendChild(el)});
  const [y,m]=currentMonth().split("-").map(Number),days=new Date(y,m,0).getDate(),first=new Date(y,m-1,1).getDay()||7;
  const sums={};entriesFor(currentMonth()).forEach(e=>sums[e.date]=(sums[e.date]||0)+signedAmount(e));
  for(let i=1;i<first;i++){const e=document.createElement("div");e.className="day off";wrap.appendChild(e)}
  for(let d=1;d<=days;d++){
    const ds=currentMonth()+"-"+String(d).padStart(2,"0"),sum=sums[ds]||0;
    let level="";if(sum>=100)level="spent3";else if(sum>=50)level="spent2";else if(sum>0)level="spent1";
    const e=document.createElement("div");e.className="day "+level;e.innerHTML=`<div class="daynum">${d}</div>${sum?`<div class="daysum">${money(sum)}</div>`:""}`;wrap.appendChild(e);
  }
}

function renderRecords(){
  const list=document.getElementById("entryList"),arr=entriesFor(currentMonth()).sort((a,b)=>b.ts-a.ts);
  if(!arr.length){list.innerHTML='<div class="card empty">这个月还没有记录</div>';return}
  list.innerHTML="";
  arr.forEach(e=>{
    const isRefund=entryType(e)==="refund",refunded=isRefund?0:refundedFor(e.id),remaining=isRefund?0:refundableAmount(e);
    const item=document.createElement("div");item.className="entry";
    const refundText=!isRefund&&refunded>0?`<div class="entry-note refund-meta">已退款 ${money(refunded)}${remaining>0?`，还可退 ${money(remaining)}`:"，已全额退"}</div>`:"";
    const noteText=escapeHtml(e.note||"");
    const refundBtn=!isRefund&&remaining>0?'<button class="refund-btn" data-action="refund">退款</button>':"";
    item.innerHTML=`<div><div class="entry-date">${e.date.slice(5,7)}月</div><div class="entry-day">${e.date.slice(8)}</div></div>
      <div class="entry-main"><div class="entry-cat">${escapeHtml(e.category)}${isRefund?' · 退款':''}</div><div class="entry-note">${noteText}</div>${refundText}</div>
      <div style="text-align:right"><div class="entry-money ${isRefund?'refund':''}">${isRefund?'+':'-'}${money(e.amount)}</div><div class="entry-actions">${refundBtn}<button class="ghost" data-action="delete">删除</button></div></div>`;
    const refundButton=item.querySelector('[data-action="refund"]');
    if(refundButton)refundButton.onclick=()=>addRefund(e);
    item.querySelector('[data-action="delete"]').onclick=()=>deleteEntry(e);
    list.appendChild(item);
  });
}

function renderSettings(){
  const wrap=document.getElementById("budgetEditor");wrap.innerHTML="";
  Object.entries(data.budgets).forEach(([cat,v])=>{
    const row=document.createElement("div");row.className="row2";row.innerHTML=`<div>${escapeHtml(cat)}</div><input type="number" inputmode="decimal" min="0" step="0.01" value="${normalizeMoney(v).toFixed(2)}" data-cat="${escapeAttr(cat)}">`;wrap.appendChild(row)
  });
  document.getElementById("carrySwitch").classList.toggle("on",!!data.carryoverEnabled);
}

function renderAll(){renderHome();renderAdd();drawDonut();renderCalendar();renderRecords();renderSettings()}
function goTab(id){document.querySelectorAll(".screen").forEach(s=>s.classList.remove("active"));document.getElementById(id).classList.add("active");document.querySelectorAll(".tab").forEach(t=>t.classList.toggle("active",t.dataset.target===id));if(id==="stats"){drawDonut();renderCalendar()}}
function addEntry(cat,amount,note){
  if(entrySubmitLocked)return;
  const n=normalizeMoney(amount);if(!n||n<=0){showToast("请输入正确金额");return}
  entrySubmitLocked=true;
  setEntryButtonsDisabled(true);
  let date=nowDateStr(),ym=currentMonth();if(date.slice(0,7)!==ym)date=ym+"-01";
  data.entries.push({id:Date.now().toString(36)+Math.random().toString(36).slice(2,7),type:"expense",category:cat,amount:n,note:note||"",date,ts:Date.now()});
  saveData();document.getElementById("amountInput").value="";document.getElementById("noteInput").value="";renderAll();showToast("记账成功");goTab("home");
  setTimeout(()=>{entrySubmitLocked=false;setEntryButtonsDisabled(false)},700);
}
function addRefund(original){
  const remaining=refundableAmount(original);
  if(remaining<=0){showToast("这笔支出已经全部退完");return}
  const raw=prompt(`退款金额（最多 ${money(remaining)}）`,remaining.toFixed(2));
  if(raw===null)return;
  const n=normalizeMoney(raw);
  if(!n||n<=0){showToast("请输入正确退款金额");return}
  if(n>remaining){showToast("退款金额不能超过原支出未退款金额");return}
  const defaultNote=original.note?`退款：${original.note}`:`退款：${original.category}`;
  const note=prompt("退款备注（可选）",defaultNote);
  if(note===null)return;
  const date=nowDateStr();
  data.entries.push({id:Date.now().toString(36)+Math.random().toString(36).slice(2,7),type:"refund",originalId:original.id,category:original.category,amount:n,note:note.trim(),date,ts:Date.now()});
  saveData();
  document.getElementById("monthPicker").value=date.slice(0,7);
  renderAll();
  showToast(`退款 ${money(n)} 已记入${Number(date.slice(5,7))}月`);
}
function deleteEntry(entry){
  if(entryType(entry)==="refund"){
    if(!confirm("确定删除这条退款记录吗？"))return;
    data.entries=data.entries.filter(x=>x.id!==entry.id);
  }else{
    const linked=data.entries.filter(x=>entryType(x)==="refund"&&x.originalId===entry.id);
    const msg=linked.length?`这笔支出已有 ${linked.length} 条退款记录。删除原支出会同时删除关联退款，确定吗？`:"确定删除这条记录吗？";
    if(!confirm(msg))return;
    const ids=new Set([entry.id,...linked.map(x=>x.id)]);
    data.entries=data.entries.filter(x=>!ids.has(x.id));
  }
  saveData();renderAll();showToast("已删除");
}
function exportData(){const blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"});const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="小账本备份.json";a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1500)}
function importData(file){const r=new FileReader();r.onload=()=>{try{const x=JSON.parse(r.result);if(!x.budgets||!x.entries)throw 0;data=x;if(typeof data.carryoverEnabled!=="boolean")data.carryoverEnabled=false;saveData();renderAll();showToast("导入成功")}catch(e){showToast("备份文件格式不对")}};r.readAsText(file)}

document.getElementById("monthPicker").value=nowMonth();
document.getElementById("monthPicker").addEventListener("change",renderAll);
document.querySelectorAll(".tab").forEach(t=>t.onclick=()=>goTab(t.dataset.target));
document.getElementById("fabBtn").onclick=()=>goTab("add");
document.getElementById("saveEntryBtn").onclick=()=>addEntry(selectedCategory,document.getElementById("amountInput").value,document.getElementById("noteInput").value.trim());
document.getElementById("canteenBtn").onclick=()=>addEntry("食堂",25,"");
document.querySelectorAll(".pill").forEach(b=>b.onclick=()=>document.getElementById("amountInput").value=b.dataset.money);
document.getElementById("saveBudgetBtn").onclick=()=>{document.querySelectorAll("#budgetEditor input").forEach(i=>data.budgets[i.dataset.cat]=normalizeMoney(i.value));saveData();renderAll();showToast("预算已保存")};
document.getElementById("carrySwitch").onclick=()=>{data.carryoverEnabled=!data.carryoverEnabled;saveData();renderAll();showToast(data.carryoverEnabled?"已开启自动结转":"已关闭自动结转")};
document.getElementById("exportBtn").onclick=exportData;
document.getElementById("importBtn").onclick=()=>document.getElementById("importFile").click();
document.getElementById("importFile").onchange=e=>{const f=e.target.files[0];if(f)importData(f);e.target.value=""};
document.getElementById("resetMonthBtn").onclick=()=>{if(!confirm("确定清空当前月份的所有记录吗？"))return;const ym=currentMonth();data.entries=data.entries.filter(e=>e.date.slice(0,7)!==ym);saveData();renderAll();showToast("当前月记录已清空")};
function refreshAfterPossibleDayChange(){
  const today=nowDateStr();
  if(today!==lastKnownDate){lastKnownDate=today;renderAll()}
  else if(document.getElementById("home").classList.contains("active"))renderHome();
}
document.addEventListener("visibilitychange",()=>{if(!document.hidden)refreshAfterPossibleDayChange()});
window.addEventListener("focus",refreshAfterPossibleDayChange);
setInterval(refreshAfterPossibleDayChange,60000);
renderAll();
</script>
</body>
</html>
